server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'self';" always;

    resolver ${DNS_RESOLVER} valid=30s;

    # Single unified backend — match + tracker endpoints live on the same API.
    set $upstream_api ${API_URL};
    set $upstream_scraper ${SCRAPER_URL};

    # Unified API: applications, interviews, notes, stats, AND /api/match —
    # but /api/match as a PREFIX would also expose title-triage,
    # seniority-classify, and discovery-score-batch: scraper-internal,
    # AI-calling routes with much looser input caps than anything the
    # browser client sends, reachable with no auth on whichever instance's
    # (private or demo — this nginx config is shared by both) real billed
    # key. The scraper never goes through this nginx to reach them — it
    # calls $upstream_api container-to-container directly. Explicit
    # alternation instead of a prefix: only the exact sub-paths
    # client/src/lib/api.ts's matchApi() actually calls are proxied; a new
    # client-facing /api/match/* route needs adding here too, on purpose,
    # not for free.
    # The two routes here that run for minutes rather than seconds: a batch is
    # an Analyst call plus an Evaluator call (~80s measured), a scan is several
    # batches, and score-jobs is a batch driven by the reader scrolling.
    # nginx's default proxy_read_timeout is 60s, which killed the request while
    # the API kept working — the browser saw a 504 and the user's scan produced
    # nothing. A regex declared BEFORE the alternation below, so these two paths
    # match here first and keep the long timeouts.
    location ~ ^/api/match/(pool-scan|score-jobs)$ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ ^/api/match(|/pool-scan|/score-jobs|/pool-band|/profile|/profile/normalize|/profile/normalize-file|/profile/resume-file|/interview-prep|/interview-prep/cues)$ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Résumé PDF, rendered inline via <embed> on the Profile page. The
    # server-level X-Frame-Options: DENY (inherited into /api/match above)
    # blocks ALL framing, same-origin included — an add_header in a location
    # replaces the whole inherited set rather than merging, so every header
    # below has to be re-declared, with this one route's X-Frame-Options
    # relaxed to SAMEORIGIN.
    location = /api/match/profile/resume-file/download {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'self';" always;
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Résumé pack PDF, rendered inline via <embed> on the Résumé Pack page —
    # same X-Frame-Options relaxation as resume-file/download above; without
    # it /api/applications below inherits the server-level DENY and Chrome's
    # PDF viewer refuses to render the embed (shows a broken-content icon).
    location ~ ^/api/applications/[^/]+/pack/pdf$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'self';" always;
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/applications {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/stats {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/interviews/ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notes/ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/messages {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Sign-in and account notices (docs/auth.md). A PREFIX here, unlike
    # /api/match above, and the difference is deliberate: /api/match needed an
    # explicit alternation because a prefix would also expose scraper-internal
    # AI routes with much looser input caps. Nothing of that kind lives under
    # /api/auth or /api/notices — every route there is browser-facing by
    # definition, since the whole point is a redirect the browser follows and a
    # cookie it stores. A prefix is what stops the next endpoint in these groups
    # silently serving the SPA instead.
    #
    # Getting this wrong is invisible: an unproxied /api/* path falls through to
    # try_files and returns 200 with index.html, so sign-in would appear to do
    # nothing at all rather than fail. That is how it was missed the first time.
    location /api/auth/ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notices {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/config {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/mock-interview {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/interview-insights {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Per-user state over the shared pool: save / dismiss / view / unsave.
    # These moved off the scraper in Phase 1 of docs/scraper-slimming.md, and
    # took a new prefix with them rather than keeping /api/discovery/jobs*.
    # Splitting one prefix across two upstreams by sub-path would work — prefix
    # locations match by length — but it is exactly the allowlist fragility that
    # let /api/auth ship unproxied, and it would put the routing of a user's
    # writes one typo away from the SPA. A whole prefix, one upstream.
    location /api/pool {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Scraper — /api/discovery/health is a lightweight warm-up probe that
    # rewrites to the service's /health. The frontend hits this on mount so
    # Render can spin the free-tier instance back up before real data calls fire.
    location = /api/discovery/health {
        rewrite ^/api/discovery/health$ /health break;
        proxy_pass $upstream_scraper;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Scraper API — read-only run history only.
    #
    # The browser no longer calls this service for anything else: Phase 3 of
    # docs/scraper-slimming.md moved the last route into the API, which reaches
    # the scraper container-to-container. What is left here is
    # /api/discovery/runs, which nothing in the client fetches either — it is
    # kept for looking at last night's run by hand.
    #
    # Generous timeouts are historical (free-tier cold starts) and harmless.
    location /api/discovery {
        proxy_pass $upstream_scraper;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Anything under /api that no block above claimed is a routing mistake, not
    # a page. Without this it falls through to try_files and returns 200 with
    # index.html, so a missed proxy block is invisible: no 404 in the logs, no
    # error in monitoring, and a browser that quietly receives HTML where it
    # expected JSON. /api/auth and /api/notices shipped that way and were caught
    # by luck rather than by anything telling us.
    #
    # Prefix locations match by length, not file order, so every specific block
    # above still wins; this only fires when nothing claimed the path. It also
    # closes the scraper-internal /api/match routes the alternation above
    # deliberately excludes — they returned the SPA before, and now say no.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"No such API route."}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
