<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
<title id="t">NextRole architecture</title>
<desc id="d">Users, company job boards and Gmail on the left feed services on one VPS: Caddy and the React app, a RabbitMQ ingest (publisher, queue, consumer) and the mail sync. All of them go through the API, the only service that calls Claude. The API scores with Claude, corrects every score with seven server-side checks, and stores it in MongoDB Atlas next to the shared pool and its vector index; Voyage embeds postings and profiles.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.4"/></marker>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9"/><feFlood flood-color="#9DB8F5" flood-opacity="0.35"/><feComposite operator="in" in2="SourceAlpha"/><feComposite operator="over" in="SourceGraphic"/></filter>
  <radialGradient id="floor" cx="68%" cy="50%" r="55%"><stop offset="0" stop-color="#9DB8F5" stop-opacity="0.10"/><stop offset="1" stop-color="#9DB8F5" stop-opacity="0"/></radialGradient>
</defs>
