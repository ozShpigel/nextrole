<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-labelledby="t d">
<title id="t">What a user does</title>
<desc id="d">Find, with no account: 1 upload a CV, read into a profile by Claude; 2 Matches, ranked for you with the reasons. Apply and track: 3 save to your board, 3 a day; 4 a tailored, fact-checked résumé pack; 5 apply on the company's own site, outside NextRole; 6 track, as Gmail replies move the card; 7 interview prep.</desc>
<defs><radialGradient id="floor" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#7B93D4" stop-opacity="0.08"/><stop offset="1" stop-color="#7B93D4" stop-opacity="0"/></radialGradient></defs>
<style>
  text{font-family:'Instrument Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
  .n{font-size:10px;font-weight:600;letter-spacing:.14em;fill:#7B93D4}
  .h{font-size:14.5px;font-weight:600;fill:#1d2b25}
  .s{font-size:11px;fill:#59645f}
  .cap{font-size:10px;font-weight:600;letter-spacing:.14em;fill:rgba(29,43,37,0.45)}
  .who{font-size:8.5px;font-weight:700;letter-spacing:.12em}
  .rail{fill:none;stroke:rgba(29,43,37,0.45);stroke-width:1.2;stroke-dasharray:2 5}
  @media (prefers-reduced-motion: reduce){.pkt{display:none}}
</style>
