services:
  api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      # Per-source key for ingest-initiated calls (ClaudeClient.ResolveClient,
      # routed by the X-Source: ingest header that PoolIngest sends) — optional,
      # blank-guarded back to the default key above if unset. Lets the Anthropic
      # console bill ingest scoring separately from everything else.
      - Anthropic__ApiKeys__ingest=${ANTHROPIC_INGEST_API_KEY:-}
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__ProfileDatabase=${JOBMATCH_MONGO_DB:-jobmatch}
      # Read-only scoring config & prompts (Options pattern). Optional overrides —
      # unset = appsettings.json "Scoring" / PromptSeeds.cs defaults. Examples:
      #   - Scoring__MinScoreToSave=75
      #   - Scoring__Evaluator__Temperature=0.6
      #   - Scoring__VerdictBands__Yes=55
      #   - Prompts__Analyzer=...   # full prompt text
      #   - Prompts__Evaluator=...  # full prompt text
      # Per-agent Hebrew narrative output — only these two agents are
      # configurable this way (see PromptOptions.HebrewOutput); every other
      # narrative agent, including the Evaluator, always writes English.
      - Prompts__HebrewOutput__WhyWorkHere=${PROMPTS_HEBREW_WHY_WORK_HERE:-false}
      - Prompts__HebrewOutput__CompanySummary=${PROMPTS_HEBREW_COMPANY_SUMMARY:-false}
      # Importing a posting by URL needs jobspy. 8080 is the container's port;
      # 8000 is the local dev one you get from `uvicorn --port 8000`.
      - Scraper__BaseUrl=http://scraper:8080

  # A jobspy adapter: parameters in, listings out. No database, no identity, no
  # outbound calls, and deliberately no credential (docs/scraper-slimming.md).
  scraper:
    build:
      context: .
      dockerfile: server/scraper/Dockerfile
    ports:
      - "5137:8080"

  # The daily pool ingest. A one-shot cron container, not a service, so it is
  # behind a profile and does not start with `docker compose up`:
  #
  #   docker compose --profile cron run --rm pool-ingest
  #
  # It owns the pipeline -- dedupe, upsert, fact extraction, age-out -- and
  # calls the scraper above for listings and the API for Claude.
  pool-ingest:
    build:
      context: .
      dockerfile: server/api/Dockerfile.poolingest
    profiles: ["cron"]
    environment:
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__Database=${MONGO_DB:-job-tracker}
      - Api__BaseUrl=http://api:8080
      - Scraper__BaseUrl=http://scraper:8080

  mailbot:
    build:
      context: .
      dockerfile: server/mailbot/Dockerfile
    environment:
      - Tracker__BaseUrl=http://api:8080
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:80"
