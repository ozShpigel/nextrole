    <path d="M270,210 H326"/>
    <path d="M630,135 H696"/>
    <path d="M630,245 H696"/>
    <path d="M805,104 C 760,22 240,22 158,116" stroke-dasharray="4 4"/>
    <path d="M810,276 V336"/>
    <path d="M700,368 H634" stroke-dasharray="4 4"/>
  </g>

  <!-- edge labels -->
  <g font-style="italic" font-size="10" fill="#6E6355" text-anchor="middle">
    <text x="299" y="142">each turn</text>
    <text x="299" y="202">at end</text>
    <text x="480" y="36">nudge · next question · done — replayed into the transcript</text>
    <text x="667" y="357" font-size="9">adopt a rewrite</text>
  </g>

  <!-- client -->
  <rect x="40" y="120" width="230" height="120" fill="#FFFFFF" stroke="#DCD2C0"/>
  <use href="#icoReact" transform="translate(58,138)" fill="#61DAFB"/>
  <text x="94" y="150" font-size="14.5" font-weight="700" fill="#201B15">Client</text>
  <text x="94" y="168" font-size="10.5" font-style="italic" fill="#6E6355">/mock-interview</text>
  <text x="58" y="200" font-size="10.5" font-style="italic" fill="#6E6355">transcript[] held client-side,</text>
  <text x="58" y="216" font-size="10.5" font-style="italic" fill="#6E6355">replayed every turn — no session state</text>

  <!-- API request builder -->
  <rect x="330" y="60" width="300" height="260" fill="#FFFFFF" stroke="#DCD2C0"/>
  <text x="350" y="88" font-size="13.5" font-weight="700" fill="#201B15">API <tspan font-weight="400" font-style="italic" fill="#6E6355">— builds one request per call</tspan></text>

  <rect x="350" y="104" width="260" height="76" fill="#ECF2EA" stroke="#7C9878"/>
  <text x="364" y="124" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#4A6B47">SYSTEM · TRUSTED</text>
  <text x="364" y="144" font-size="10.5" font-style="italic" fill="#201B15">profile · self-presentation</text>
  <text x="364" y="160" font-size="10.5" font-style="italic" fill="#201B15">Q&amp;A rubric as the skeleton</text>

  <rect x="350" y="200" width="260" height="76" fill="#F5ECEA" stroke="#A25B4E"/>
  <text x="364" y="220" font-family="Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#8C3A2E">USER · UNTRUSTED — XML-WRAPPED</text>
  <text x="364" y="240" font-size="10.5" font-style="italic" fill="#201B15">candidate answers · transcript</text>
  <text x="364" y="256" font-size="10.5" font-style="italic" fill="#201B15">job context (bound mode)</text>

  <!-- Claude chips -->
  <rect x="700" y="104" width="220" height="62" fill="#FFFFFF" stroke="#DCD2C0" stroke-dasharray="4 3"/>
  <use href="#icoClaude" transform="translate(712,124) scale(0.83)" fill="#D97757"/>
  <text x="742" y="131" font-size="12" font-weight="600" fill="#201B15">Claude Haiku</text>
  <text x="742" y="149" font-size="10" font-style="italic" fill="#6E6355">per turn — question + nudge</text>

  <rect x="700" y="214" width="220" height="62" fill="#FFFFFF" stroke="#DCD2C0" stroke-dasharray="4 3"/>
  <use href="#icoClaude" transform="translate(712,234) scale(0.83)" fill="#D97757"/>
  <text x="742" y="241" font-size="12" font-weight="600" fill="#201B15">Claude Sonnet</text>
  <text x="742" y="259" font-size="10" font-style="italic" fill="#6E6355">debrief — scores · rewrites</text>

  <!-- outcomes -->
  <rect x="700" y="340" width="220" height="56" fill="#FFFFFF" stroke="#DCD2C0" stroke-dasharray="4 3"/>
  <use href="#icoMongo" transform="translate(712,358) scale(0.83)" fill="#47A248"/>
  <text x="742" y="363" font-size="12" font-weight="600" fill="#201B15">mockInterviewSessions</text>
  <text x="742" y="381" font-size="10" font-style="italic" fill="#6E6355">saved · reopenable</text>

  <rect x="390" y="340" width="240" height="56" fill="#FFFFFF" stroke="#DCD2C0"/>
  <text x="406" y="363" font-size="12" font-weight="600" fill="#201B15">Interview-prep rubric</text>
  <text x="406" y="381" font-size="10" font-style="italic" fill="#6E6355">a debrief rewrite becomes a prep answer</text>

  <!-- caption -->
  <text x="40" y="432" font-size="10" font-style="italic" fill="#6E6355">The server keeps no session state — and trusted prep never shares a prompt block with untrusted answers.</text>
</svg>
