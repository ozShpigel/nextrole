# RabbitMQ settings for the Greenhouse ingest broker.
#
# This file is MANUAL STATE ON THE BOX. `deploy/` is not synced by CI (AGENTS.md
# -- it has bitten twice), so editing it here and merging changes nothing on the
# server until it is copied to /srv/nextrole/rabbitmq/10-nextrole.conf by hand.
# It is mounted read-only the same way the monitoring configs are.
#
# Why a file at all: RabbitMQ 4 has no supported environment-variable form for
# vm_memory_high_watermark. The RABBITMQ_VM_MEMORY_HIGH_WATERMARK variable that
# search results still suggest was removed; setting it does nothing and fails
# silently, which is the worst of the three outcomes.

# ABSOLUTE, not a relative fraction. The default is `relative = 0.4`, and the
# figure it takes 40% of is the HOST's memory, not the container's limit -- so
# on this 8GB box a container capped far lower would still have believed it had
# ~3.2GB of headroom and would have kept accepting messages until the OOM
# killer, rather than applying back-pressure to the publisher.
#
# 512MB is far more than this workload needs: the queue carries one small JSON
# message per company per day, not the job bodies.
vm_memory_high_watermark.absolute = 512MB

# Reachable from the host only -- the port mapping in compose.yml already binds
# to 127.0.0.1, this is the second lock on the same door.
listeners.tcp.default = 5672

# The default `guest` account is restricted to localhost connections anyway, but
# inside a container "localhost" is the container, so guest would be reachable
# from anything sharing the network. RABBITMQ_DEFAULT_USER/PASS in .env.rabbitmq
# create the real account; this makes sure guest is not a fallback.
loopback_users.guest = true
