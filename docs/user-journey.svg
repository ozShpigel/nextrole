<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uj-title uj-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="uj-title">NextRole user journey</title>
  <desc id="uj-desc">Find: upload a CV with no signup and Claude reads it into a profile; Matches opens, and for a city or kind of role nobody had yet, a collecting notice shows while a run fetches them, about two minutes; each card is scored as the user reaches it. Apply and track: add a job to the board, generate a tailored résumé pack, apply on the company's site, Gmail sync moves the card on replies, and interview prep rehearses for the interview.</desc>

  <defs>
    <marker id="uj-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57524b"/>
    </marker>
  </defs>

  <!-- ===== row labels ===== -->
  <g font-size="11" font-weight="600" fill="#6b6259" letter-spacing="0.6" text-anchor="middle">
    <text x="450" y="28">FIND — MINUTES AFTER ARRIVING, NO ACCOUNT</text>
    <text x="450" y="204">APPLY &amp; TRACK — ONE BOARD, KEPT CURRENT BY YOUR INBOX</text>
  </g>

  <!-- ===== connectors ===== -->
  <g fill="none" stroke="#57524b" stroke-width="1.6" marker-end="url(#uj-arrow)">
    <line x1="285" y1="95" x2="309" y2="95"/>
    <line x1="590" y1="95" x2="614" y2="95"/>
    <!-- row 1 → row 2 -->
    <path d="M740,146 L740,176 L110,176 L110,215"/>
    <line x1="185" y1="265" x2="199" y2="265"/>
    <line x1="355" y1="265" x2="369" y2="265"/>
    <line x1="525" y1="265" x2="539" y2="265"/>
    <line x1="695" y1="265" x2="709" y2="265"/>
  </g>

  <!-- ===== row 1: find ===== -->
  <rect x="35" y="44" width="250" height="102" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>
  <rect x="325" y="44" width="265" height="102" rx="10" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.6"/>
  <rect x="630" y="44" width="235" height="102" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>

  <g text-anchor="middle" fill="#211c18">
    <text x="160" y="72" font-size="14" font-weight="600" fill="#8a3a20">1 · Upload a CV</text>
    <text x="160" y="93" font-size="10.5" fill="#6b6259">no signup — a session cookie is you</text>
    <text x="160" y="108" font-size="10.5" fill="#6b6259">Claude reads it into a profile</text>
    <text x="160" y="123" font-size="10.5" fill="#6b6259">you can edit; roles and places</text>
    <text x="160" y="138" font-size="10.5" fill="#6b6259">join what the ingest looks for</text>

    <text x="457" y="72" font-size="14" font-weight="600">2 · Matches</text>
    <text x="457" y="93" font-size="10.5" fill="#6b6259">roles from the tracked companies,</text>
    <text x="457" y="108" font-size="10.5" fill="#6b6259">posted in the last 30 days</text>
    <text x="457" y="123" font-size="10.5" fill="#6b6259">a city or role nobody had yet:</text>
    <text x="457" y="138" font-size="10.5" fill="#6b6259">"Collecting roles like yours…" · ~2 min</text>

    <text x="747" y="72" font-size="14" font-weight="600" fill="#8a3a20">3 · Scored as you look</text>
    <text x="747" y="93" font-size="10.5" fill="#6b6259">STRONG_YES … STRONG_NO</text>
    <text x="747" y="108" font-size="10.5" fill="#6b6259">with the reasons, per dimension</text>
    <text x="747" y="123" font-size="10.5" fill="#6b6259">only the cards you reach —</text>
    <text x="747" y="138" font-size="10.5" fill="#6b6259">nothing scored in advance</text>
  </g>

  <!-- ===== row 2: apply & track ===== -->
  <rect x="35" y="220" width="150" height="92" rx="10" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.6"/>
  <rect x="205" y="220" width="150" height="92" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>
  <rect x="375" y="220" width="150" height="92" rx="10" fill="#eef0f2" stroke="#5b6572" stroke-width="1.6" stroke-dasharray="5 4"/>
  <rect x="545" y="220" width="150" height="92" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>
  <rect x="715" y="220" width="150" height="92" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>

  <g text-anchor="middle" fill="#211c18">
    <text x="110" y="248" font-size="14" font-weight="600">4 · Add</text>
    <text x="110" y="268" font-size="10.5" fill="#6b6259">to the Active board</text>
    <text x="110" y="283" font-size="10.5" fill="#6b6259">Added → Ready →</text>
    <text x="110" y="298" font-size="10.5" fill="#6b6259">Applied → Interviewing</text>

    <text x="280" y="248" font-size="14" font-weight="600" fill="#8a3a20">5 · Résumé pack</text>
    <text x="280" y="268" font-size="10.5" fill="#6b6259">tailored PDF per posting</text>
    <text x="280" y="283" font-size="10.5" fill="#6b6259">checked against your profile</text>
    <text x="280" y="298" font-size="10.5" fill="#6b6259">before you see it · 3/day</text>

    <text x="450" y="248" font-size="14" font-weight="600" fill="#252b32">6 · Apply</text>
    <text x="450" y="268" font-size="10.5" fill="#5b6572">on the company's</text>
    <text x="450" y="283" font-size="10.5" fill="#5b6572">own site</text>

    <text x="620" y="248" font-size="14" font-weight="600" fill="#8a3a20">7 · Mail sync</text>
    <text x="620" y="268" font-size="10.5" fill="#6b6259">replies in Gmail move</text>
    <text x="620" y="283" font-size="10.5" fill="#6b6259">the card: interview,</text>
    <text x="620" y="298" font-size="10.5" fill="#6b6259">rejection, offer · never back</text>

    <text x="790" y="248" font-size="14" font-weight="600" fill="#8a3a20">8 · Interview prep</text>
    <text x="790" y="268" font-size="10.5" fill="#6b6259">self-presentation, a Q&amp;A</text>
    <text x="790" y="283" font-size="10.5" fill="#6b6259">rubric, a mock interview</text>
    <text x="790" y="298" font-size="10.5" fill="#6b6259">from AI-distilled cues</text>
  </g>

  <text x="450" y="342" font-size="11.5" fill="#6b6259" text-anchor="middle">Optional Google sign-in only reconnects the same session from another browser — it never creates a second account.</text>

  <!-- ===== legend ===== -->
  <g font-size="11" fill="#6b6259">
    <rect x="35" y="366" width="14" height="14" rx="3" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.4"/>
    <text x="57" y="377">In NextRole</text>
    <rect x="165" y="366" width="14" height="14" rx="3" fill="#f4f1ea" stroke="#b5502e" stroke-width="2"/>
    <text x="187" y="377" fill="#8a3a20">Uses Claude</text>
    <rect x="295" y="366" width="14" height="14" rx="3" fill="#eef0f2" stroke="#5b6572" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="317" y="377">Outside NextRole</text>
  </g>
</svg>
