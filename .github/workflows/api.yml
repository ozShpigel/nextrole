name: API

on:
  push:
    branches: [main]
    paths:
      - 'server/api/**'
      - '.github/workflows/api.yml'

env:
  IMAGE_NAME: api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image owner lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
      # Same source tree, same commit, same workflow. Both images compile Core
      # and Infrastructure, so they must ship together: two workflows on the
      # same server/api/** filter could deploy an API on new Core while
      # pool-ingest still ran the old one, and nothing would report it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/api/Dockerfile.poolingest
          push: true
          tags: ghcr.io/${{ env.OWNER }}/pool-ingest:latest
      # Same reasoning, one step further. This image and the API share more than
      # Core: they share the EMBEDDING CLIENT, the model and the dimensions
      # (GreenhouseEmbeddingOptions). If they ever shipped from different
      # commits and disagreed about either, $vectorSearch would return an empty
      # result rather than an error -- the prefilter would simply stop finding
      # good jobs, with nothing in any log to say so.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/api/Dockerfile.greenhouse
          push: true
          tags: ghcr.io/${{ env.OWNER }}/greenhouse:latest
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 62.238.100.118
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/nextrole
            docker compose pull api
            docker compose up -d --force-recreate api
            # pool-ingest is a cron container: nothing is running to recreate.
            # Pulling is enough — the next timer fire starts a fresh one from
            # the new image.
            docker compose --profile cron pull pool-ingest
            # greenhouse is two services from one image: a cron container
            # (publish) that the next timer fire starts fresh, and a
            # LONG-RUNNING consumer that has to be recreated to pick up the new
            # image. Pulling alone would leave the old consumer running against
            # the new API -- which is exactly the drift the shared embedding
            # client exists to prevent.
            docker compose --profile cron pull greenhouse
            docker compose pull greenhouse-consumer
            docker compose up -d --force-recreate greenhouse-consumer    
            # Reclaim the image this pull just orphaned.
            #
            # `:latest` is a moving tag: pulling a new build retags it and the
            # previous image keeps every layer while losing its name. Docker has
            # no image garbage collector -- unlike kubelet, it ships no
            # retention policy and no disk threshold -- so nothing ever removes
            # them. Across 487 deploys that reached 281 images and 30 GB, and
            # filled the box to 94%.
            #
            # Here rather than in a timer on the box: cleanup belongs to the
            # event that creates the garbage, it cannot drift out of sync, and
            # it lives in the repo rather than as manual state `deploy/` does
            # not sync.
            #
            # -f, NOT -a. Dangling images only. `-a` removes anything no RUNNING
            # container holds, and pool-ingest, mailbot and greenhouse-publish
            # are cron containers that do not exist between runs -- it would
            # delete their images and break the next timer firing until a deploy
            # re-pulled them.
            docker image prune -f
