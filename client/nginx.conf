server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'self';" always;

    resolver ${DNS_RESOLVER} valid=30s;

    # Single unified backend — match + tracker endpoints live on the same API.
    set $upstream_api ${API_URL};
    set $upstream_scraper ${SCRAPER_URL};

    # Unified API: applications, interviews, notes, stats, AND /api/match —
    # but /api/match as a PREFIX would also expose title-triage,
    # seniority-classify, and discovery-score-batch: scraper-internal,
    # AI-calling routes with much looser input caps than anything the
    # browser client sends, reachable with no auth on whichever instance's
    # (private or demo — this nginx config is shared by both) real billed
    # key. The scraper never goes through this nginx to reach them — it
    # calls $upstream_api container-to-container directly. Explicit
    # alternation instead of a prefix: only the exact sub-paths
    # client/src/lib/api.ts's matchApi() actually calls are proxied; a new
    # client-facing /api/match/* route needs adding here too, on purpose,
    # not for free.
    location ~ ^/api/match(|/profile|/profile/normalize|/profile/normalize-file|/profile/resume-file|/interview-prep|/interview-prep/cues)$ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Résumé PDF, rendered inline via <embed> on the Profile page. The
    # server-level X-Frame-Options: DENY (inherited into /api/match above)
    # blocks ALL framing, same-origin included — an add_header in a location
    # replaces the whole inherited set rather than merging, so every header
    # below has to be re-declared, with this one route's X-Frame-Options
    # relaxed to SAMEORIGIN.
    location = /api/match/profile/resume-file/download {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'self';" always;
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Résumé pack PDF, rendered inline via <embed> on the Résumé Pack page —
    # same X-Frame-Options relaxation as resume-file/download above; without
    # it /api/applications below inherits the server-level DENY and Chrome's
    # PDF viewer refuses to render the embed (shows a broken-content icon).
    location ~ ^/api/applications/[^/]+/pack/pdf$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; object-src 'self';" always;
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/applications {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/stats {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/interviews/ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/notes/ {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/messages {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/config {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/mock-interview {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/interview-insights {
        proxy_pass $upstream_api;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Scraper — /api/discovery/health is a lightweight warm-up probe that
    # rewrites to the service's /health. The frontend hits this on mount so
    # Render can spin the free-tier instance back up before real data calls fire.
    location = /api/discovery/health {
        rewrite ^/api/discovery/health$ /health break;
        proxy_pass $upstream_scraper;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Scraper API
    # Generous timeouts because Render free tier cold-starts can take 30–90s;
    # Render's router holds the TCP connection while the service wakes, so
    # proxy_read_timeout must outlast the slowest cold start we've observed.
    location /api/discovery {
        proxy_pass $upstream_scraper;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
