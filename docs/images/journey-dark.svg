<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-labelledby="t d">
<title id="t">What a user does</title>
<desc id="d">Find: 1 upload a CV, read into a profile by Claude, then sign in with Google; 2 Matches, ranked for you with the reasons. Apply and track: 3 a tailored, fact-checked résumé pack; 4 apply, sent for you where NextRole can, or on the company's own site; 5 the employer's replies arrive in the application's own inbox; 6 track, as those replies move its status; 7 interview prep.</desc>
<defs><radialGradient id="floor" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#9DB8F5" stop-opacity="0.08"/><stop offset="1" stop-color="#9DB8F5" stop-opacity="0"/></radialGradient></defs>
<style>
  text{font-family:'Instrument Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif}
