services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  # nextrole.cloud. These three were called demo-api / demo-scraper / demo-client
  # until the teardown: they began life serving a seeded read-only demo and were
  # repurposed to serve the real product, so for a while the names said the
  # opposite of what they were. If you find `demo-` anywhere still, it is a
  # leftover, not a second deployment.
  api:
    image: ghcr.io/ozshpigel/api:latest
    restart: unless-stopped
    env_file: [.env.api]
    environment:
      - DOTNET_gcServer=0
      # Importing a posting by URL needs jobspy, and jobspy is Python. This is
      # the API's only call into the scraper, and it makes the dependency
      # bidirectional -- previously the scraper called the API and never the
      # reverse. 8080 is the container's port; 8000 is the local dev one.
      - Scraper__BaseUrl=http://scraper:8080

  # The jobspy adapter. Parameters in, listings out -- no database, no identity,
  # no decisions (docs/scraper-slimming.md, Phase 3d). PoolIngest and the API
  # call it; the browser does not.
  #
  # It deliberately holds no credential. .env.scraper is down to CORS_ORIGINS,
  # and MONGODB_CONNECTION_STRING should be deleted from it on the box -- a
  # service that parses hostile HTML has no business holding readWrite on two
  # production databases. Leaving it set is harmless (Settings ignores unknown
  # keys) but it is the credential that matters, not the code that ignores it.
  scraper:
    image: ghcr.io/ozshpigel/scraper:latest
    restart: unless-stopped
    env_file: [.env.scraper]

  # Not `client`: this repo already uses "client" for the /client directory and
  # for a half-dozen HTTP clients OF things (TrackerApiClient, tracker_client,
  # match_client). `web` is the thing a browser connects to, and nothing else.
  # It also proxies /api/* through to api and scraper — see client/nginx.conf,
  # which resolves API_URL/SCRAPER_URL from .env.web as Docker DNS names.
  web:
    image: ghcr.io/ozshpigel/frontend:latest
    restart: unless-stopped
    env_file: [.env.web]

  # The shared job pool's daily ingest. Reads its role list from
  # config/roles.json in the image — not from anyone's saved search — and is
  # what every user matches against. Without it a visitor can upload a CV and
  # still see an empty Matches tab, because the candidate filter has no
  # extracted requirements to filter on (docs/job-pool.md).
  #
  # This is now the ONLY ingest. The criteria-driven `run-all` service ran
  # alongside it until the teardown, 30 minutes earlier, scraping into the same
  # pool: three of its four job titles were already in roles.json and its
  # locations sat inside "Israel", so pool_key deduped the rows while the
  # scrape itself was paid twice. "AI Engineer" was the only coverage it added
  # and now lives in roles.json. search_criteria rows are untouched in the
  # database, so restoring it means restoring a cron, not recreating data.
  #
  # .NET since Phase 2 of docs/scraper-slimming.md. The scraper still does the
  # scraping -- this calls its POST /scrape -- but everything the run DECIDES
  # (what is new, what to keep, what to extract, what to age out) is here, with
  # the pool's models and Mongo layer in process.
  #
  # Its image is built by api.yml alongside the API, from the same commit,
  # because both compile Core.
  pool-ingest:
    image: ghcr.io/ozshpigel/pool-ingest:latest
    profiles: ["cron"]
    env_file: [.env.pool-ingest]
    environment:
      # Docker DNS, container to container. No nginx in this path, so the only
      # timeout that applies is the one PoolIngest sets on its HttpClient.
      - Api__BaseUrl=http://api:8080
      # 8080, not 8000. The container's Dockerfile runs uvicorn on 8080; the
      # 8000 in AGENTS.md's run instructions is the LOCAL dev port. Same
      # service, two ports depending on how it was started, and the wrong one
      # fails as "Connection refused" rather than as anything that names a port.
      - Scraper__BaseUrl=http://scraper:8080
      # Roles__ConfigPath is left at its default, /app/config/roles.json, which
      # ships in the image. Point it at a mounted file to override the role
      # list without a rebuild.

  mailbot:
    image: ghcr.io/ozshpigel/mailbot:latest
    # The sleep lets the buffered console logger flush before the container
    # exits. `rc` is what makes it honest: `sh -c "dotnet ...; sleep 20"` returns
    # SLEEP's status, so the process always exited 0 -- discarding the non-zero
    # Program.cs returns when it refuses to sync against a demo instance. A
    # mailbot that aborted and one that synced looked identical to systemd.
    # `$$` is escaped for compose's own variable interpolation.
    entrypoint: sh -c "dotnet Mailbot.dll; rc=$$?; sleep 20; exit $$rc"
    profiles: ["cron"]
    env_file: [.env.mailbot]
    environment:
      # `api` was the PRIVATE instance until the teardown, running
      # Identity:Mode=Fixed -- identity came from configuration, so a client
      # presented nothing. It is now nextrole.cloud, in Cookie mode, where a
      # client that presents nothing is answered with a FRESH ANONYMOUS USER
      # rather than an error. For an hour that is what happened: 115
      # applications in the database, 0 seen, {"Success":true} (issue #67).
      #
      # The mailbot now presents Tracker__SessionToken from .env.mailbot and
      # refuses to start if it cannot confirm which account that resolves to.
      # So this line is verified by the run itself -- a 'Syncing as <email>'
      # line -- rather than by looking correct.
      - Tracker__BaseUrl=http://api:8080
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./gmail-token.json:/etc/secrets/gmail-token.json:ro

  # The Greenhouse ingest broker. NOT behind the cron profile and NOT one-shot:
  # the publisher is a daily timer but the consumer is long-running, so the
  # broker has to outlive both.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    env_file: [.env.rabbitmq]
    ports:
      # 127.0.0.1 only -- nothing outside this box speaks AMQP to it. 15672 is
      # the management UI, which is how you look at the DLQ without writing a
      # consumer for it. Reach it over an SSH tunnel, as with Grafana on 3001.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      # MANUAL STATE. `deploy/` is not synced by CI, so editing this file in the
      # repo changes nothing here until it is copied to the box by hand. It
      # carries vm_memory_high_watermark.absolute=512MB, which has no supported
      # environment-variable form in RabbitMQ 4 -- the variable that search
      # results still suggest was removed and now does nothing, silently.
      - ./rabbitmq/10-nextrole.conf:/etc/rabbitmq/conf.d/10-nextrole.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # check_running, not ping: ping answers as soon as the Erlang VM is up,
      # several seconds before the broker accepts an AMQP connection.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # The Greenhouse source's fan-out. A cron container like pool-ingest: it
  # writes one pending ledger row and publishes one message per board token in
  # config/companies.json, then exits.
  #
  #   docker compose --profile cron run --rm greenhouse publish
  #
  # It needs no embedding key -- only the consumer embeds.
  greenhouse:
    image: ghcr.io/ozshpigel/greenhouse:latest
    profiles: ["cron"]
    env_file: [.env.greenhouse]
    depends_on:
      rabbitmq:
        condition: service_healthy

  # The Greenhouse source's worker. Long-running, deliberately: a one-shot
  # consumer would have to decide when the work is finished, and an empty queue
  # is not that -- a message can be in flight, or delivered and unacked and
  # about to be redelivered. "Done" is zero pending rows in greenhouse_runs for
  # the day, which anyone can query without this process having to be right
  # about it on the way out.
  #
  # One company at a time (prefetch 1), acking only after the Mongo write. A
  # company that fails goes to the dead-letter queue rather than back onto the
  # queue: requeueing a 429 is a hot loop that also blocks every other company.
  #
  # It is also the only Greenhouse service that calls the API (the ingest AI
  # reads, at Api__BaseUrl in .env.greenhouse). That value is OPTIONAL to the
  # process and load-bearing in fact: without it the consumer runs, embeds and
  # stores factless postings after one warning, and the hash skip means nothing
  # re-reads them. See the note in .env.example before editing that file.
  greenhouse-consumer:
    image: ghcr.io/ozshpigel/greenhouse:latest
    command: ["consume"]
    restart: unless-stopped
    env_file: [.env.greenhouse]
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Not a correctness guard -- the client retries and a company that fails
      # dead-letters rather than losing its embeddings. It just stops every
      # posting of the first run after a full restart from being stored
      # factless because the API had not come up yet.
      api:
        condition: service_started

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      # Dashboards are provisioned from the repo now. The one dashboard that
      # existed before lived only in the grafana-data volume, so a volume loss
      # would have taken it with no copy anywhere.
      - ./monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/nextrole.yml:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on: [loki]
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
  rabbitmq-data:
