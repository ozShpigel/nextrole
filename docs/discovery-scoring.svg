<svg viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ds-title ds-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ds-title">Discovery and per-user scoring</title>
  <desc id="ds-desc">Top row, shared by every user: fetch a company's whole board, skip unchanged postings by content hash, a pre-read filter skips postings nobody could want (age, location, kind of work), the rest are embedded and stored, and Claude extracts their facts once through the Batch API. They land in one shared job pool. Bottom row, per user when Matches opens: vector search plus filters on the extracted facts, the Evaluator scores each job against the profile (the parse is made on first score and saved for everyone), server-side checks verify the model's claims, and the score is stored for that user only.</desc>

  <defs>
    <marker id="ds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57524b"/>
    </marker>
  </defs>

  <!-- ===== row labels ===== -->
  <g font-size="11" font-weight="600" fill="#6b6259" letter-spacing="0.6" text-anchor="middle">
    <text x="450" y="28">DAILY INGEST — SHARED BY EVERY USER, NO PROFILE READ</text>
    <text x="450" y="284">ON OPENING MATCHES — PER USER, SCORES ONLY WHAT'S NEW</text>
  </g>

  <!-- ===== connectors ===== -->
  <g fill="none" stroke="#57524b" stroke-width="1.6" marker-end="url(#ds-arrow)">
    <line x1="185" y1="85" x2="199" y2="85"/>
    <line x1="355" y1="85" x2="369" y2="85"/>
    <line x1="525" y1="85" x2="539" y2="85"/>
    <line x1="695" y1="85" x2="709" y2="85"/>
    <line x1="790" y1="130" x2="790" y2="173"/>
    <line x1="120" y1="226" x2="120" y2="297"/>
    <line x1="230" y1="345" x2="248" y2="345"/>
    <line x1="443" y1="345" x2="461" y2="345"/>
    <line x1="656" y1="345" x2="674" y2="345"/>
  </g>
  <!-- skipped postings drop out, never paid for -->
  <g fill="none" stroke="#8a929c" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="455" y1="130" x2="455" y2="150"/>
  </g>

  <!-- ===== top row: shared ingest ===== -->
  <g stroke="#2b2521" stroke-width="1.6" fill="#f4f1ea">
    <rect x="35" y="44" width="150" height="86" rx="10"/>
    <rect x="205" y="44" width="150" height="86" rx="10"/>
    <rect x="375" y="44" width="150" height="86" rx="10"/>
    <rect x="545" y="44" width="150" height="86" rx="10"/>
  </g>
  <rect x="715" y="44" width="150" height="86" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>

  <g text-anchor="middle" fill="#211c18">
    <text x="110" y="72" font-size="14" font-weight="600">Fetch board</text>
    <text x="110" y="92" font-size="10.5" fill="#6b6259">whole board, one call</text>
    <text x="110" y="107" font-size="10.5" fill="#6b6259">count must match total,</text>
    <text x="110" y="121" font-size="10.5" fill="#6b6259">or nothing is closed</text>

    <text x="280" y="72" font-size="14" font-weight="600">Changed?</text>
    <text x="280" y="92" font-size="10.5" fill="#6b6259">content hash</text>
    <text x="280" y="107" font-size="10.5" fill="#6b6259">unchanged → touched,</text>
    <text x="280" y="121" font-size="10.5" fill="#6b6259">costs nothing</text>

    <text x="450" y="72" font-size="14" font-weight="600">Pre-read filter</text>
    <text x="450" y="92" font-size="10.5" fill="#6b6259">age · location · kind of work</text>
    <text x="450" y="107" font-size="10.5" fill="#6b6259">skips only the clearly</text>
    <text x="450" y="121" font-size="10.5" fill="#6b6259">irrelevant; unsure is read</text>

    <text x="620" y="72" font-size="14" font-weight="600">Embed + store</text>
    <text x="620" y="92" font-size="10.5" fill="#6b6259">Voyage · one vector</text>
    <text x="620" y="107" font-size="10.5" fill="#6b6259">per posting</text>

    <text x="790" y="72" font-size="14" font-weight="600" fill="#8a3a20">Extract facts</text>
    <text x="790" y="92" font-size="10.5" fill="#6b6259">Claude · Batch API, half price</text>
    <text x="790" y="107" font-size="10.5" fill="#6b6259">seniority · must-have tech</text>
    <text x="790" y="121" font-size="10.5" fill="#6b6259">location · kind of work</text>
  </g>

  <!-- skipped chip -->
  <g>
    <rect x="395" y="150" width="120" height="20" rx="4" fill="#eef0f2" stroke="#8a929c" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="455" y="164" font-size="10.5" fill="#5b6572" text-anchor="middle">~60% never paid for</text>
  </g>

  <!-- ===== shared pool ===== -->
  <rect x="35" y="176" width="830" height="50" rx="10" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.6"/>
  <g text-anchor="middle">
    <text x="450" y="197" font-size="14" font-weight="600" fill="#211c18">Shared job pool — one row per posting, whoever it suits</text>
    <text x="450" y="215" font-size="10.5" fill="#6b6259">facts read once for everyone · gone from its board → closed, never deleted · older than 4 months → not read</text>
  </g>

  <!-- ===== bottom row: per user ===== -->
  <rect x="35" y="300" width="195" height="92" rx="10" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.6"/>
  <rect x="248" y="300" width="195" height="92" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>
  <rect x="461" y="300" width="195" height="92" rx="10" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.6"/>
  <rect x="674" y="300" width="191" height="92" rx="10" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.6"/>

  <g text-anchor="middle" fill="#211c18">
    <text x="132" y="328" font-size="14" font-weight="600">Retrieve</text>
    <text x="132" y="348" font-size="10.5" fill="#6b6259">vector search on your profile</text>
    <text x="132" y="363" font-size="10.5" fill="#6b6259">+ filters on the facts, no AI</text>
    <text x="132" y="378" font-size="10.5" fill="#6b6259">last 30 days · not yet scored</text>

    <text x="345" y="328" font-size="14" font-weight="600" fill="#8a3a20">Evaluator</text>
    <text x="345" y="348" font-size="10.5" fill="#6b6259">one judgement per job, against</text>
    <text x="345" y="363" font-size="10.5" fill="#6b6259">your profile · parse made on</text>
    <text x="345" y="378" font-size="10.5" fill="#6b6259">first score, saved for everyone</text>

    <text x="558" y="328" font-size="14" font-weight="600">Server-side checks</text>
    <text x="558" y="348" font-size="10.5" fill="#6b6259">claims about you traced</text>
    <text x="558" y="363" font-size="10.5" fill="#6b6259">to your profile · caps from the</text>
    <text x="558" y="378" font-size="10.5" fill="#6b6259">posting's must-haves, not the model</text>

    <text x="769" y="328" font-size="14" font-weight="600">Stored for you</text>
    <text x="769" y="348" font-size="10.5" fill="#6b6259">top candidates on open,</text>
    <text x="769" y="363" font-size="10.5" fill="#6b6259">the rest as you scroll</text>
    <text x="769" y="378" font-size="10.5" fill="#6b6259">never scored twice · 120/day</text>
  </g>

  <text x="450" y="420" font-size="11.5" fill="#6b6259" text-anchor="middle">Nothing in the top row knows who you are. Nothing in the bottom row is shared — except a parse, which is a fact about the posting.</text>

  <!-- ===== legend ===== -->
  <g font-size="11" fill="#6b6259">
    <rect x="35" y="442" width="14" height="14" rx="3" fill="#f4f1ea" stroke="#2b2521" stroke-width="1.4"/>
    <text x="57" y="453">Step, no AI</text>
    <rect x="165" y="442" width="14" height="14" rx="3" fill="#f4f1ea" stroke="#b5502e" stroke-width="2"/>
    <text x="187" y="453" fill="#8a3a20">Claude call</text>
    <rect x="295" y="442" width="14" height="14" rx="3" fill="#eef0f2" stroke="#8a929c" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="317" y="453">Skipped before any cost</text>
  </g>
</svg>
