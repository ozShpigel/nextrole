name: Frontend

# Trigger note: bumped 2026-08-16 to force a rebuild after removing the
# VITE_API_URL=/api repo variable (was double-prefixing every API call).
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/frontend.yml'

env:
  IMAGE_NAME: frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image owner lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_SCRAPER_URL=${{ vars.VITE_SCRAPER_URL }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 62.238.100.118
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/nextrole
            docker compose pull demo-client
            docker compose up -d --force-recreate demo-client      
