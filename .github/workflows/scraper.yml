name: Scraper

on:
  push:
    branches: [main]
    paths:
      - 'server/scraper/**'
      - '.github/workflows/scraper.yml'

env:
  IMAGE_NAME: scraper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image owner lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/scraper/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: 62.238.100.118
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /srv/nextrole
            docker compose pull scraper demo-scraper
            docker compose up -d --force-recreate scraper demo-scraper
            docker compose --profile cron pull ingest    
