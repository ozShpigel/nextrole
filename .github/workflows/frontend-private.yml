name: Frontend (private)

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/frontend-private.yml'

env:
  IMAGE_NAME: frontend-private

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image owner lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile.private
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_SCRAPER_URL=${{ vars.VITE_SCRAPER_URL_PRIVATE }}
            VITE_API_URL=${{ vars.VITE_API_URL_PRIVATE }}
