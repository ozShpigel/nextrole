<svg viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ds-title ds-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="ds-title">NextRole discovery &amp; scoring pipeline</title>
  <desc id="ds-desc">One linear pass per discovery run, with no separate on-demand search step: scrape, AI title triage, seniority classification, company and news enrichment prefetch, batched Evaluator scoring judging up to five jobs per Claude call independently, then store. The Matches page only filters and sorts jobs that are already scored.</desc>

  <defs>
    <marker id="ds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57524b"/>
    </marker>
    <marker id="ds-arrow-accent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b5502e"/>
    </marker>
  </defs>

  <!-- ===== span annotation over the whole pass ===== -->
  <g stroke="#8a8378" stroke-width="1.2">
    <line x1="40" y1="30" x2="40" y2="22"/>
    <line x1="40" y1="22" x2="860" y2="22"/>
    <line x1="860" y1="30" x2="860" y2="22"/>
  </g>
  <text x="450" y="15" text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="0.4" fill="#6b6259">PER DISCOVERY RUN — ONE LINEAR PASS, NO ON-DEMAND SEARCH STEP</text>

  <!-- ===== pipeline connectors ===== -->
  <g fill="none" stroke="#57524b" stroke-width="1.6">
    <line x1="160" y1="98" x2="178" y2="98" marker-end="url(#ds-arrow)"/>
    <line x1="300" y1="98" x2="318" y2="98" marker-end="url(#ds-arrow)"/>
    <line x1="440" y1="98" x2="458" y2="98" marker-end="url(#ds-arrow)"/>
    <line x1="580" y1="98" x2="598" y2="98" marker-end="url(#ds-arrow)"/>
    <line x1="720" y1="98" x2="738" y2="98" marker-end="url(#ds-arrow)"/>
  </g>

  <!-- Store -> Matches page: a read-only downstream consumer, not part of the pass -->
  <line x1="800" y1="142" x2="800" y2="189" fill="none" stroke="#57524b" stroke-width="1.6" marker-end="url(#ds-arrow)"/>
  <g font-size="10.5" fill="#3a352f" text-anchor="middle">
    <rect x="742" y="156" width="116" height="17" rx="4" fill="#f4f1ea" stroke="#cfc7ba" stroke-width="1"/>
    <text x="800" y="168">filters &amp; sorts only</text>
  </g>

  <!-- ===== pipeline stages (solid) ===== -->
  <g stroke="#2b2521" stroke-width="1.6" fill="#f4f1ea">
    <rect x="40" y="54" width="120" height="88" rx="10"/>
    <rect x="180" y="54" width="120" height="88" rx="10"/>
    <rect x="320" y="54" width="120" height="88" rx="10"/>
    <rect x="460" y="54" width="120" height="88" rx="10"/>
    <rect x="740" y="54" width="120" height="88" rx="10"/>
  </g>
  <!-- Evaluator scoring: the core AI step, drawn with the accent color -->
  <rect x="600" y="54" width="120" height="88" rx="10" fill="#f4f1ea" stroke="#b5502e" stroke-width="2.2"/>

  <g text-anchor="middle" fill="#211c18">
    <text x="100" y="93" font-size="13" font-weight="600">Scrape</text>
    <text x="100" y="110" font-size="10" fill="#6b6259">LinkedIn / Indeed</text>

    <text x="240" y="86" font-size="13" font-weight="600">AI Title</text>
    <text x="240" y="101" font-size="13" font-weight="600">Triage</text>
    <text x="240" y="118" font-size="10" fill="#6b6259">drop off-target roles</text>

    <text x="380" y="86" font-size="13" font-weight="600">Seniority</text>
    <text x="380" y="101" font-size="13" font-weight="600">Classify</text>
    <text x="380" y="118" font-size="10" fill="#6b6259">AI-classified band</text>

    <text x="520" y="79" font-size="12.5" font-weight="600">Enrichment</text>
    <text x="520" y="94" font-size="12.5" font-weight="600">Prefetch</text>
    <text x="520" y="111" font-size="9.5" fill="#6b6259">Glassdoor + company news</text>
    <text x="520" y="124" font-size="9.5" fill="#6b6259">(RAG via search, no vectors)</text>

    <text x="800" y="93" font-size="13" font-weight="600">Store</text>
    <text x="800" y="110" font-size="10" fill="#6b6259">fully scored → tracker DB</text>
  </g>

  <g text-anchor="middle" fill="#8a3a20">
    <text x="660" y="79" font-size="12.5" font-weight="700">Evaluator</text>
    <text x="660" y="94" font-size="12.5" font-weight="700">Scoring</text>
    <text x="660" y="111" font-size="9.5">up to 5 jobs / Claude call</text>
    <text x="660" y="124" font-size="9.5">each judged independently</text>
  </g>

  <!-- ===== downstream consumer (dashed — not part of the scoring pass) ===== -->
  <rect x="710" y="190" width="180" height="56" rx="10" fill="#eef0f2" stroke="#5b6572" stroke-width="1.6" stroke-dasharray="5 4"/>
  <g text-anchor="middle" fill="#252b32">
    <text x="800" y="213" font-size="13" font-weight="600">Matches page</text>
    <text x="800" y="231" font-size="10" fill="#5b6572">Read-only browse of scored jobs</text>
  </g>
</svg>
