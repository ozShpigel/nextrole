services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  api:
    image: ghcr.io/ozshpigel/api:latest
    restart: unless-stopped
    env_file: [.env.api]
    environment:
      - DOTNET_gcServer=0

  scraper:
    image: ghcr.io/ozshpigel/scraper:latest
    restart: unless-stopped
    env_file: [.env.scraper]
    environment:
      - API_BASE_URL=http://api:8080

  client:
    image: ghcr.io/ozshpigel/frontend-private:latest
    restart: unless-stopped
    env_file: [.env.client]
    volumes:
      - ./.htpasswd:/etc/secrets/.htpasswd:ro

  demo-api:
    image: ghcr.io/ozshpigel/api:latest
    restart: unless-stopped
    env_file: [.env.demo-api]
    environment:
      - DOTNET_gcServer=0

  demo-scraper:
    image: ghcr.io/ozshpigel/scraper:latest
    restart: unless-stopped
    env_file: [.env.demo-scraper]
    environment:
      - API_BASE_URL=http://demo-api:8080

  demo-client:
    image: ghcr.io/ozshpigel/frontend:latest
    restart: unless-stopped
    env_file: [.env.demo-client]

  ingest:
    image: ghcr.io/ozshpigel/scraper:latest
    profiles: ["cron"]
    command: python -m app.cli run-all
    env_file: [.env.scraper]
    environment:
      - API_BASE_URL=http://api:8080

  mailbot:
    image: ghcr.io/ozshpigel/mailbot:latest
    entrypoint: sh -c "dotnet Mailbot.dll; sleep 20"
    profiles: ["cron"]
    env_file: [.env.mailbot]
    environment:
      - Tracker__BaseUrl=http://api:8080
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./gmail-token.json:/etc/secrets/gmail-token.json:ro
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "127.0.0.1:3100:3100"    
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on: [loki]
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data: