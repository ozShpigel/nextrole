<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490" role="img">
<title>One job record accumulating data through the pipeline</title>
<desc>Five columns, one per stage. The scraped record passes a triage gate that drops off-target jobs, then gains a seniority band and the requirements extracted from its text. The first four stages are shared by every user and read no profile; only the last column, the score, belongs to one person.</desc>
<rect x="0" y="0" width="920" height="490" fill="#ffffff"/>

<text x="40" y="42" font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="500" fill="#1c2126">One job record — what's added, and who it belongs to</text>
<text x="40" y="66" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#73726c">Triage is the only stage that removes. The first four are shared by every user; only the score is yours.</text>
<line x1="40" y1="86" x2="880" y2="86" stroke="#e0ded8" stroke-width="1"/>

<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="110" y="116" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#1c2126" text-anchor="middle">Scrape</text>
<text x="285" y="116" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#1c2126" text-anchor="middle">Triage</text>
<text x="460" y="116" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#1c2126" text-anchor="middle">Classify</text>
<text x="635" y="116" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#1c2126" text-anchor="middle">Extract</text>
<text x="810" y="116" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8a3a20" text-anchor="middle">Score — per user</text>

<path d="M188 178 L207 178" stroke="#b4b2a9" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M363 178 L382 178" stroke="#b4b2a9" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M538 178 L557 178" stroke="#b4b2a9" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M713 178 L732 178" stroke="#b4b2a9" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

