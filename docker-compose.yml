services:
  api:
    build:
      context: .
      dockerfile: server/api/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      # Per-source key for ingest-initiated calls (ClaudeClient.ResolveClient,
      # routed by the X-Source: ingest header that PoolIngest sends) — optional,
      # blank-guarded back to the default key above if unset. Lets the Anthropic
      # console bill ingest scoring separately from everything else.
      - Anthropic__ApiKeys__ingest=${ANTHROPIC_INGEST_API_KEY:-}
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__ProfileDatabase=${JOBMATCH_MONGO_DB:-jobmatch}
      # Read-only scoring config & prompts (Options pattern). Optional overrides —
      # unset = appsettings.json "Scoring" / PromptSeeds.cs defaults. Examples:
      #   - Scoring__MinScoreToSave=75
      #   - Scoring__Evaluator__Temperature=0.6
      #   - Scoring__VerdictBands__Yes=55
      #   - Prompts__Analyzer=...   # full prompt text
      #   - Prompts__Evaluator=...  # full prompt text
      # Per-agent Hebrew narrative output — only these two agents are
      # configurable this way (see PromptOptions.HebrewOutput); every other
      # narrative agent, including the Evaluator, always writes English.
      - Prompts__HebrewOutput__WhyWorkHere=${PROMPTS_HEBREW_WHY_WORK_HERE:-false}
      - Prompts__HebrewOutput__CompanySummary=${PROMPTS_HEBREW_COMPANY_SUMMARY:-false}
      # Importing a posting by URL needs jobspy. 8080 is the container's port;
      # 8000 is the local dev one you get from `uvicorn --port 8000`.
      - Scraper__BaseUrl=http://scraper:8080

  # A jobspy adapter: parameters in, listings out. No database, no identity, no
  # outbound calls, and deliberately no credential (docs/scraper-slimming.md).
  scraper:
    build:
      context: .
      dockerfile: server/scraper/Dockerfile
    ports:
      - "5137:8080"

  # The daily pool ingest. A one-shot cron container, not a service, so it is
  # behind a profile and does not start with `docker compose up`:
  #
  #   docker compose --profile cron run --rm pool-ingest
  #
  # It owns the pipeline -- dedupe, upsert, fact extraction, age-out -- and
  # calls the scraper above for listings and the API for Claude.
  pool-ingest:
    build:
      context: .
      dockerfile: server/api/Dockerfile.poolingest
    profiles: ["cron"]
    environment:
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__Database=${MONGO_DB:-job-tracker}
      - Api__BaseUrl=http://api:8080
      - Scraper__BaseUrl=http://scraper:8080

  mailbot:
    build:
      context: .
      dockerfile: server/mailbot/Dockerfile
    environment:
      - Tracker__BaseUrl=http://api:8080
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:80"

  # The Greenhouse ingest broker. Local dev mirror of the production service in
  # deploy/compose.yml -- same image, same conf file, same 127.0.0.1 binding.
  #
  # Unlike every other service here it is NOT behind the cron profile and NOT
  # one-shot: the publisher is a daily timer, but the consumer is long-running,
  # so the broker has to outlive both.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      # These create the account only on a FRESH volume. Changing them later and
      # restarting does nothing -- the Mnesia database already has the user, and
      # the container starts happily with the old credentials while the .env
      # file says otherwise. Rotate with `rabbitmqctl change_password`, or by
      # deleting the volume.
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-nextrole}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-nextrole-dev}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-nextrole}
    ports:
      # 127.0.0.1 only. 5672 is AMQP; 15672 is the management UI, which is in
      # the -management image and is how you look at the DLQ without writing a
      # consumer for it.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./deploy/rabbitmq/10-nextrole.conf:/etc/rabbitmq/conf.d/10-nextrole.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # `ping` answers as soon as the Erlang VM is up, which is several seconds
      # before the broker accepts an AMQP connection. check_running is the one
      # that means "you may now connect".
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # The Greenhouse source. Two entry points, one image:
  #
  #   docker compose --profile cron run --rm greenhouse publish   (daily timer)
  #   docker compose up -d greenhouse-consumer                    (long-running)
  #
  # `publish` fans one message out per board token in config/companies.json and
  # exits. `consume` stays up -- see the comment on CompanyConsumer for why it
  # is not one-shot (an empty queue is not the same as done).
  greenhouse:
    build:
      context: .
      dockerfile: server/api/Dockerfile.greenhouse
    # Both services pin the SAME image tag, because in production they are the
    # same image (ghcr.io/ozshpigel/greenhouse:latest) run with two different
    # commands. Without this, compose builds nextrole-greenhouse and
    # nextrole-greenhouse-consumer separately, `docker compose build greenhouse`
    # leaves the consumer on a stale image, and a local run stops resembling the
    # deployment it is meant to rehearse.
    image: nextrole-greenhouse:local
    profiles: ["cron"]
    environment:
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__Database=${MONGO_DB:-job-tracker}
      - Rabbit__Uri=amqp://${RABBITMQ_USER:-nextrole}:${RABBITMQ_PASSWORD:-nextrole-dev}@rabbitmq:5672/${RABBITMQ_VHOST:-nextrole}
      # ONE small board locally, not every company: a day of local runs over
      # all of them cost $6.25 (AGENTS.md, Testing). Set
      # GREENHOUSE_COMPANIES_CONFIG=config/companies.json to run the real list.
      - Companies__ConfigPath=${GREENHOUSE_COMPANIES_CONFIG:-config/companies.dev.json}
      # Publishing needs no embedding key: it writes ledger rows and messages.
      # Only the consumer embeds.
    depends_on:
      rabbitmq:
        condition: service_healthy

  greenhouse-consumer:
    build:
      context: .
      dockerfile: server/api/Dockerfile.greenhouse
    image: nextrole-greenhouse:local
    command: ["consume"]
    restart: unless-stopped
    environment:
      - MongoDB__ConnectionString=${MONGODB_CONNECTION_STRING}
      - MongoDB__Database=${MONGO_DB:-job-tracker}
      - Rabbit__Uri=amqp://${RABBITMQ_USER:-nextrole}:${RABBITMQ_PASSWORD:-nextrole-dev}@rabbitmq:5672/${RABBITMQ_VHOST:-nextrole}
      # ONE small board locally, not every company: a day of local runs over
      # all of them cost $6.25 (AGENTS.md, Testing). Set
      # GREENHOUSE_COMPANIES_CONFIG=config/companies.json to run the real list.
      - Companies__ConfigPath=${GREENHOUSE_COMPANIES_CONFIG:-config/companies.dev.json}
      # The SAME model and dimensions the API binds for FindCandidateJobIds.
      # If these two ever disagree, $vectorSearch returns nothing and nothing
      # anywhere errors -- so they are one config section, not two.
      - Greenhouse__Embedding__ApiKey=${VOYAGE_API_KEY}
      - Greenhouse__Embedding__Model=${VOYAGE_MODEL:-voyage-4}
      - Greenhouse__Embedding__Dimensions=${VOYAGE_DIMENSIONS:-1024}
      # WITHOUT THIS the consumer still runs and still embeds, and every posting
      # it stores gets an empty `extracted` and no `parsed`. That is silent and
      # expensive: the server-side stackedGaps check goes inert so Core Stack is
      # scored on the model's own unchecked reading, the location and seniority
      # filters fall back to raw board text, and every per-user scan pays for an
      # inline Analyst parse -- measured at 2.1x the whole ingest pipeline.
      #
      # It was missing here, and missing on the production box, and neither
      # failed: the ingest logs one startup warning and then runs happily
      # forever. Reached by Docker DNS, so it is the API's SERVICE name and
      # container port, never localhost.
      - Api__BaseUrl=${API_INTERNAL_URL:-http://api:8080}
      # Only needed when the instance-wide ApiKey gate is on. Harmless when
      # unset; the header is simply not sent.
      - Api__ApiKey=${API_KEY:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  rabbitmq-data:
