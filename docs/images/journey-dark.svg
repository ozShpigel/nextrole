  .h{font-size:14.5px;font-weight:600;fill:#ffffff}
  .s{font-size:11px;fill:#a7adba}
  .cap{font-size:10px;font-weight:600;letter-spacing:.14em;fill:rgba(255,255,255,0.42)}
  .who{font-size:8.5px;font-weight:700;letter-spacing:.12em}
  .rail{fill:none;stroke:rgba(255,255,255,0.42);stroke-width:1.2;stroke-dasharray:2 5}
  @media (prefers-reduced-motion: reduce){.pkt{display:none}}
</style>
