server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # Container name -> service label. The (?:-run)? branch catches the
      # `docker compose run --rm` containers the cron jobs use, so pool-ingest
      # and mailbot land under the same label as a long-running service would.
      - source_labels: ['__meta_docker_container_name']
        regex: '/nextrole-([a-z-]+?)(?:-run)?-[0-9a-f]+'
        target_label: 'service'
      # There is one environment. There used to be a second rule here that
      # overrode env to "demo" for any service matching `demo-.*` -- which, once
      # those services were repurposed to serve nextrole.cloud, meant PRODUCTION
      # logs were labelled env=demo and the private instance's were labelled
      # env=prod. Exactly backwards, and silent: a query against the wrong stack
      # returns plausible results. Filter by `service` instead (issue #64).
      - target_label: 'env'
        replacement: 'prod'
